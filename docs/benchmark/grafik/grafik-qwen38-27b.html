/** Grafik batang berkelompok (kategori x seri). */
function batang(w, o) {
  const H = o.tinggi || 280, L = 56, R = 16, Tp = 18, B = 46;
  const semua = o.series.flatMap(s => s.nilai).concat((o.ideal || [])).filter(v => v != null);
  const { lg, top } = skala(Math.max(...semua) * 1.12);
  const yp = v => Tp + (H - Tp - B) * (1 - v / top), lebarK = (w - L - R) / o.xs.length, nS = o.series.length, bw = Math.min(46, lebarK * .7 / nS);
  let s = "";
  for (let v = 0; v <= top + 1e-9; v += lg) s += `<line class="gl" x1="${L}" x2="${w - R}" y1="${yp(v)}" y2="${yp(v)}"/><text class="ax" x="${L - 8}" y="${yp(v) + 4}" text-anchor="end">${nf(v, Number.isInteger(lg) ? 0 : 1)}</text>`;
  o.xs.forEach((x, i) => {
    const cx = L + lebarK * (i + .5);
    s += `<text class="ax" x="${cx}" y="${H - B + 18}" text-anchor="middle">${esc(x)}</text>`;
    o.series.forEach((se, j) => {
      const v = se.nilai[i]; if (v == null) return;
      const x = cx - nS * bw / 2 + j * bw + 2;
      s += `<rect x="${x}" y="${yp(v)}" width="${bw - 4}" height="${yp(0) - yp(v)}" rx="3" fill="var(${se.warna})" tabindex="0" class="pt" data-tip="${esc(se.tips[i])}" aria-label="${esc(se.tips[i].replace(/\n/g, ", "))}"/>`;
      s += `<text class="el" x="${x + (bw - 4) / 2}" y="${yp(v) - 6}" text-anchor="middle">${nf(v, o.desimal ?? 0)}</text>`;
    });
    if (o.ideal && o.ideal[i] != null) s += `<line x1="${cx - nS * bw / 2 - 4}" x2="${cx + nS * bw / 2 + 4}" y1="${yp(o.ideal[i])}" y2="${yp(o.ideal[i])}" stroke="var(--ink3)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  });
  s += `<text class="axt" x="${(L + w - R) / 2}" y="${H - 8}" text-anchor="middle">${esc(o.xJudul)}</text>`;
  s += `<text class="axt" transform="translate(14 ${(Tp + H - B) / 2}) rotate(-90)" text-anchor="middle">${esc(o.yJudul)}</text>`;
  return `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="${esc(o.aria)}">${s}</svg>`;
}
/** Batang mendatar bertumpuk. rows: {label, bag:{k:v}}. */
function tumpuk(w, o) {
  const L = Math.min(190, w * .32), R = 54, Tp = 6, tinggi = 28, H = Tp + o.rows.length * tinggi + 40;
  const tot = r => o.kunci.reduce((a, k) => a + (r.bag[k] || 0), 0);
  const { lg, top } = skala(Math.max(...o.rows.map(tot)) * 1.04, w < 500 ? 4 : 7);
  const xp = v => L + (w - L - R) * v / top;
  let s = "";
  for (let v = 0; v <= top + 1e-9; v += lg) s += `<line class="gl" x1="${xp(v)}" x2="${xp(v)}" y1="${Tp}" y2="${H - 34}"/><text class="ax" x="${xp(v)}" y="${H - 20}" text-anchor="middle">${nf(v, Number.isInteger(lg) ? 0 : 1)}</text>`;
  o.rows.forEach((r, i) => {
    const y = Tp + i * tinggi + 4; let x = 0;
    s += `<text class="ax" x="${L - 8}" y="${y + 14}" text-anchor="end">${esc(r.label)}</text>`;
    o.kunci.forEach(k => { const v = r.bag[k] || 0; if (v <= 0) return;
      const t = `${r.label}\n${o.nama[k]}: ${nf(v)} ${o.satuan}\n${nf(100 * v / tot(r), 0)}% dari total`;
      s += `<rect x="${xp(x)}" y="${y}" width="${Math.max(.8, xp(x + v) - xp(x) - 1)}" height="${tinggi - 10}" rx="2" fill="var(--w-${k})" class="pt" tabindex="-1" data-tip="${esc(t)}"/>`; x += v; });
    s += `<text class="el" x="${xp(x) + 6}" y="${y + 14}">${nf(x)}</text>`;
  });
  s += `<text class="axt" x="${(L + w - R) / 2}" y="${H - 4}" text-anchor="middle">${esc(o.xJudul)}</text>`;
  return `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="${esc(o.aria)}">${s}</svg>`;
}
/** Deret waktu GPU (satu metrik), dengan pita fase. */
function deret(w, o) {
  const H = o.tinggi || 220, L = 52, R = 14, Tp = 22, B = 40;
  const d = o.deret, tmax = d[d.length - 1][0] / 60, top = o.top;
  const xp = m => L + (w - L - R) * m / tmax, yp = v => Tp + (H - Tp - B) * (1 - v / top);
  let s = "";
  o.fase.forEach(([n, a, b], i) => { s += `<rect class="band" x="${xp(a / 60)}" y="${Tp}" width="${Math.max(1, xp(b / 60) - xp(a / 60))}" height="${H - Tp - B}"/>`;
    s += `<text class="ax" x="${(xp(a / 60) + xp(b / 60)) / 2}" y="${Tp - 6}" text-anchor="middle">${esc(w < 640 ? n.split(" ")[0] : n)}</text>`; });
  const { lg } = skala(top, 4);
  for (let v = 0; v <= top + 1e-9; v += lg) s += `<line class="gl" x1="${L}" x2="${w - R}" y1="${yp(v)}" y2="${yp(v)}"/><text class="ax" x="${L - 8}" y="${yp(v) + 4}" text-anchor="end">${nf(v, 0)}</text>`;
  const lgx = skala(tmax, w < 500 ? 4 : 8).lg;
  for (let m = 0; m <= tmax + 1e-9; m += lgx) s += `<text class="ax" x="${xp(m)}" y="${H - B + 16}" text-anchor="middle">${nf(m, Number.isInteger(lgx) ? 0 : 1)}</text>`;
  s += `<polyline fill="none" stroke="var(${o.warna})" stroke-width="1.6" points="${d.map(r => `${xp(r[0] / 60)},${yp(r[o.idx])}`).join(" ")}"/>`;
  if (o.ref) s += `<line class="ref" x1="${L}" x2="${w - R}" y1="${yp(o.ref.v)}" y2="${yp(o.ref.v)}"/><text class="ax" x="${L + 4}" y="${yp(o.ref.v) + 13}">${esc(o.ref.label)}</text>`;
  // titik tooltip tak terlihat, satu per 30 detik
  const lompat = Math.max(1, Math.round(30 / 5));
  d.forEach((r, i) => { if (i % lompat) return; s += `<rect x="${xp(r[0] / 60) - 3}" y="${Tp}" width="6" height="${H - Tp - B}" fill="transparent" data-tip="${esc(`menit ${nf(r[0] / 60)}\n${o.nama}: ${nf(r[o.idx])} ${o.satuan}\n(rata-rata 5 detik)`)}"/>`; });
  s += `<text class="axt" x="${(L + w - R) / 2}" y="${H - 6}" text-anchor="middle">menit sejak rekaman dimulai</text>`;
  s += `<text class="axt" transform="translate(13 ${(Tp + H - B) / 2}) rotate(-90)" text-anchor="middle">${esc(o.yJudul)}</text>`;
  return `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="${esc(o.aria)}">${s}</svg>`;
}
const NAMA_BAG = { persiapan: "Persiapan agent", tunggu: "Menunggu kata pertama", berpikir: "Model berpikir", rencana: "Model menulis perintah alat", menulis: "Model menulis teks", ekor: "Model, sisa lain", alat: "Alat berjalan", lain: "Kode agent & jeda" };
const BAG = ["persiapan", "tunggu", "berpikir", "rencana", "menulis", "ekor", "alat", "lain"];
function waterfall(w, q) {
  const baris = [{ label: "Persiapan agent", seg: [["persiapan", 0, q.persiapan]] }];
  q.langkah.forEach(l => {
    if (l.jenis === "alat") baris.push({ label: l.label, seg: [["alat", l.a, l.a + l.dur]] });
    else baris.push({ label: l.label + (l.masuk ? ` · ${nf0(l.masuk)}→${nf0(l.keluar)} tok` : ""), seg: l.seg.map(([k, x, y]) => [k, l.a + x, l.a + y]) });
  });
  const L = Math.min(270, w * .42), R = 18, Tp = 6, tinggi = 24, H = Tp + baris.length * tinggi + 44;
  const top = Math.max(q.total, ...baris.flatMap(b => b.seg.map(s => s[2]))) * 1.02;
  const { lg } = skala(top, w < 500 ? 4 : 8);
  const xp = t => L + (w - L - R) * t / top;
  let s = "";
  for (let v = 0; v <= top + 1e-9; v += lg) s += `<line class="gl" x1="${xp(v)}" x2="${xp(v)}" y1="${Tp}" y2="${H - 38}"/><text class="ax" x="${xp(v)}" y="${H - 24}" text-anchor="middle">${nf(v, Number.isInteger(lg) ? 0 : 1)}</text>`;
  s += `<line x1="${xp(q.total)}" x2="${xp(q.total)}" y1="${Tp}" y2="${H - 38}" stroke="var(--ink2)" stroke-dasharray="3 3"/>`;
  baris.forEach((b, i) => {
    const y = Tp + i * tinggi + 3;
    s += `<text class="ax" x="${L - 8}" y="${y + 12}" text-anchor="end">${esc(b.label.length > 52 ? b.label.slice(0, 51) + "…" : b.label)}</text>`;
    b.seg.forEach(([k, a, z]) => { const t = `${b.label}\n${NAMA_BAG[k]}: ${nf(z - a, 2)} dtk\nmulai detik ${nf(a)}`;
      s += `<rect x="${xp(a)}" y="${y}" width="${Math.max(1.5, xp(z) - xp(a))}" height="${tinggi - 8}" rx="2" fill="var(--w-${k})" class="pt" data-tip="${esc(t)}"/>`; });
  });
  s += `<text class="axt" x="${(L + w - R) / 2}" y="${H - 6}" text-anchor="middle">detik sejak pertanyaan dikirim · garis putus = jawaban selesai (${nf(q.total)} dtk)</text>`;
  return `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="Waterfall ${esc(q.kode)}">${s}</svg>`;
}

/* ---------- tabel: cari, urut, ekspor CSV ---------- */
function tabel(el, o) {
  let urut = null, arah = 1, cari = "";
  const id = "t" + Math.random().toString(36).slice(2, 8);
  el.innerHTML = `<div class="tblbar">${o.cari !== false ? `<input type="search" placeholder="Cari di tabel…" aria-label="Cari di tabel ${esc(o.judul)}" id="${id}-c">` : ""}<button class="btn" type="button" id="${id}-x">Unduh CSV</button><span class="n" id="${id}-n"></span></div><div class="tw"><table><caption class="na" style="caption-side:bottom;text-align:left;padding:6px 2px;font-size:12px">${esc(o.judul)}</caption><thead><tr>${o.kol.map((k, i) => `<th scope="col" class="${k.num ? "num" : ""}" aria-sort="none"><button type="button" data-i="${i}">${esc(k.label)}</button></th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
  const tb = el.querySelector("tbody");
  const nilai = (r, k) => typeof k.v === "function" ? k.v(r) : r[k.key];
  function isi() {
    let rows = o.rows.slice();
    if (cari) rows = rows.filter(r => o.kol.some(k => String(k.f ? k.f(nilai(r, k), r) : nilai(r, k)).toLowerCase().includes(cari)));
    if (urut != null) { const k = o.kol[urut]; rows.sort((a, b) => { const x = nilai(a, k), y = nilai(b, k); if (x == null) return 1; if (y == null) return -1; return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "id", { numeric: true })) * arah; }); }
    tb.innerHTML = rows.map(r => `<tr>${o.kol.map(k => { const v = nilai(r, k); const t = k.html ? k.html(v, r) : esc(k.f ? k.f(v, r) : v ?? "—"); return `<td class="${k.num ? "num" : ""} ${k.wrap ? "wrap" : ""}">${t}</td>`; }).join("")}</tr>`).join("");
    el.querySelector(`#${id}-n`).textContent = `${rows.length} dari ${o.rows.length} baris`;
    return rows;
  }
  el.querySelectorAll("th button").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i; arah = urut === i ? -arah : 1; urut = i;
    el.querySelectorAll("th").forEach(th => th.setAttribute("aria-sort", "none"));
    b.parentElement.setAttribute("aria-sort", arah > 0 ? "ascending" : "descending"); isi(); }));
  const c = el.querySelector(`#${id}-c`); if (c) c.addEventListener("input", () => { cari = c.value.trim().toLowerCase(); isi(); });
  el.querySelector(`#${id}-x`).addEventListener("click", () => {
    const rows = isi(); const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
    const csv = [o.kol.map(k => q(k.label)).join(",")].concat(rows.map(r => o.kol.map(k => { const v = nilai(r, k); return q(k.csv ? k.csv(v, r) : (v == null ? "" : typeof v === "number" ? v : (k.f ? k.f(v, r) : v))); }).join(","))).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = (o.berkas || "data") + ".csv"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); });
  isi();
}

const SUDAH = {};
