<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluasi Ratu AI</title>
<meta name="description" content="Evaluasi kecepatan, akurasi, dan biaya Ratu AI di AWS EC2 g5.12xlarge">
<script>try{var t=localStorage.getItem('evaluasi-tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--ink:#111827;--ink2:#4b5563;--ink3:#6b7280;--line:#e3e6eb;--grid:#eceff3;
  --accent:#4338ca;--accent-ink:#3730a3;--accent-soft:#eef0fd;--base:#8b95a5;--base-soft:#eef0f3;--c3:#0f766e;--c4:#9333ea;--on-mark:#fff;
  --good:#15803d;--good-soft:#e8f5ec;--warn:#a15c07;--warn-soft:#fdf3e1;--bad:#b42318;--bad-soft:#fdecea;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 1px 3px rgba(17,24,39,.04);color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0c1017;--surface:#131a26;--surface2:#1a2232;--ink:#e7eaf0;--ink2:#a9b2c3;--ink3:#8a94a8;--line:#253044;--grid:#1e2838;
  --accent:#8f95fb;--accent-ink:#c9ccff;--accent-soft:#1e2244;--base:#6b7486;--base-soft:#1b2231;--c3:#2dd4bf;--c4:#c084fc;--on-mark:#0c1017;
  --good:#4ade80;--good-soft:#112a1c;--warn:#fbbf24;--warn-soft:#2b220d;--bad:#f87171;--bad-soft:#2f1517;--shadow:none;color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1017;--surface:#131a26;--surface2:#1a2232;--ink:#e7eaf0;--ink2:#a9b2c3;--ink3:#8a94a8;--line:#253044;--grid:#1e2838;
  --accent:#8f95fb;--accent-ink:#c9ccff;--accent-soft:#1e2244;--base:#6b7486;--base-soft:#1b2231;--c3:#2dd4bf;--c4:#c084fc;--on-mark:#0c1017;
  --good:#4ade80;--good-soft:#112a1c;--warn:#fbbf24;--warn-soft:#2b220d;--bad:#f87171;--bad-soft:#2f1517;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:50}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{color:var(--ink3);font-size:12px}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14px}
nav.menu a:hover{background:var(--surface2);color:var(--ink)}
nav.menu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
nav.menu .no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--surface2);font-size:11px;color:var(--ink3);flex:none}
nav.menu a[aria-current="page"] .no{background:var(--accent);color:#fff}
.side .bawah{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink3);padding:0 8px}
main{min-width:0;padding:28px 36px 64px;max-width:1220px;width:100%}
.atas{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:6px}
.atas .meta{color:var(--ink3);font-size:13px}
.aksi{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:13.5px}
.btn:hover{color:var(--ink);border-color:var(--ink3)}
.btn.utama{background:var(--accent);border-color:var(--accent);color:#fff}
h1{font-size:28px;line-height:1.2;margin:10px 0 6px;letter-spacing:-.015em}
h2{font-size:19px;margin:34px 0 6px;letter-spacing:-.005em}
h3{font-size:15.5px;margin:0 0 4px}
.tujuan{color:var(--ink2);margin:0 0 18px;max-width:860px}
.page[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);margin:14px 0;min-width:0}
.card .ket{color:var(--ink2);font-size:13.5px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2>.card,.grid3>.card{margin:0}
.vonis{border-left:4px solid var(--accent);font-size:15.5px}.vonis p{margin:0 0 6px}.vonis .kecil{color:var(--ink3);font-size:13px;margin:0}
/* KPI */
.pilar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0}
.pilar .card{margin:0;display:flex;flex-direction:column;gap:12px}
.pilar .kepala{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink)}
.pilar .tanya{color:var(--ink2);font-size:13.5px;margin:-6px 0 0}
.kpi{border-top:1px solid var(--grid);padding-top:10px}
.kpi:first-of-type{border-top:0;padding-top:0}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:500;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:3px}
.kpi.utama .v{font-size:34px}
.kpi .k{font-size:12.5px;color:var(--ink3)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:4px;font-variant-numeric:tabular-nums}
.chip.baik{background:var(--good-soft);color:var(--good)}.chip.buruk{background:var(--bad-soft);color:var(--bad)}.chip.netral{background:var(--surface2);color:var(--ink2)}
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--ink3);color:var(--ink3);font-size:10.5px;font-weight:700;cursor:help;flex:none}
/* tabel */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 11px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface2);color:var(--ink2);font-weight:600;z-index:1;white-space:nowrap}
tbody tr:hover td{background:var(--surface2)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 8px}
.tbar input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;width:240px;max-width:100%}
.tbar .jml{margin-left:auto;color:var(--ink3);font-size:12.5px}
/* kontrol */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface2);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--ink2);font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:6px 0 12px}
.ctl .lbl{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
/* grafik */
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink2);margin:2px 0 6px}.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--grid)}.chart .ax{fill:var(--ink3);font-size:11.5px}.chart .axt{fill:var(--ink2);font-size:12px}.chart .el{fill:var(--ink2);font-size:11px;font-weight:600}
.chart .pt{cursor:pointer}.chart .pt:focus{outline:none;stroke:var(--ink);stroke-width:2}
.tafsir{background:var(--accent-soft);border-radius:9px;padding:10px 13px;font-size:13.5px;margin:12px 0 0;color:var(--ink)}
.tafsir b{color:var(--accent-ink)}
.catatan{background:var(--warn-soft);border-radius:9px;padding:10px 13px;font-size:13.5px;margin:12px 0 0}.catatan b{color:var(--warn)}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:10px 0}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";color:var(--ink3);font-size:18px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>.isi{padding:0 16px 14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.pill.lulus{background:var(--good-soft);color:var(--good)}.pill.sebagian{background:var(--warn-soft);color:var(--warn)}.pill.gagal{background:var(--bad-soft);color:var(--bad)}.pill.abu{background:var(--surface2);color:var(--ink2)}
.kutip{background:var(--surface2);border-radius:8px;padding:8px 11px;font-size:13px;white-space:pre-wrap;margin:4px 0}
dl.dua{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;margin:6px 0;font-size:13.5px}dl.dua dt{color:var(--ink3)}dl.dua dd{margin:0}
.form{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:500}
.form .bantu{font-weight:400;color:var(--ink3);font-size:12px;line-height:1.4}
.isian-hasil{border:1px dashed var(--line);border-radius:8px;padding:7px 10px;font-variant-numeric:tabular-nums;color:var(--ink)}
.lompat{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.lompat button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 13px;font-size:13px;color:var(--ink2);cursor:pointer}
.lompat button:hover{border-color:var(--accent);color:var(--accent-ink)}
h2[id]{scroll-margin-top:16px}
#k-hasil{grid-template-columns:repeat(2,minmax(0,1fr))}
.form input,.form select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-variant-numeric:tabular-nums}
.hasil{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.hasil div{background:var(--surface2);border-radius:10px;padding:10px 12px}.hasil b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.hasil span{font-size:12.5px;color:var(--ink2)}
.timeline{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:20px}
.timeline .ev{position:relative;margin:0 0 16px}.timeline .ev::before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--base)}
.timeline .ev.kini::before{border-color:var(--accent);background:var(--accent)}
.timeline .tg{font-size:12.5px;color:var(--ink3)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:8px;max-width:320px;white-space:pre-line;display:none}
.foot{color:var(--ink3);font-size:12.5px;margin-top:36px;border-top:1px solid var(--line);padding-top:12px}
.belum{color:var(--ink3);font-style:italic}
@media (max-width:1100px){.pilar{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,minmax(0,1fr))}.hasil{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{min-width:0}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  nav.menu{flex-direction:row;overflow-x:auto;gap:4px}nav.menu a{white-space:nowrap;padding:7px 10px}.side .bawah{display:none}
  main{padding:18px 16px 48px}.chart{overflow-x:auto}.chart svg{min-width:560px}.grid2,.grid3{grid-template-columns:1fr}dl.dua{grid-template-columns:1fr}h1{font-size:24px}}
@media print{.side,.aksi,.ctl,.tbar,.noprint{display:none!important}.app{display:block}main{max-width:none;padding:0}.page{display:block!important;break-before:page}.page:first-of-type{break-before:auto}
  h1,h2,h3{break-after:avoid}.card{box-shadow:none}.kpi,tr,.vonis{break-inside:avoid}details>.isi{display:block!important}.tw{max-height:none;overflow:visible}body{background:#fff}}
</style>
</head>
<body>
<a class="skip" href="#isi">Lewati ke konten</a>
<div class="app">
  <aside class="side" aria-label="Navigasi">
    <div class="brand"><div class="logo" aria-hidden="true">R</div><div><b>Ratu AI</b><small>Evaluasi performa &amp; biaya</small></div></div>
    <nav class="menu" id="menu" aria-label="Halaman"></nav>
    <div class="bawah"><span id="b-tarif"></span><span>Data uji 13–24 Nov 2026</span></div>
  </aside>
  <main id="isi" tabindex="-1">
    <div class="atas"><span class="meta" id="meta"></span>
      <div class="aksi"><button class="btn" type="button" id="cetak">Cetak / PDF</button><button class="btn" type="button" id="tema" aria-pressed="false">Mode gelap</button></div></div>
    <section class="page" id="p-ringkasan" aria-labelledby="h-ringkasan"></section>
    <section class="page" id="p-kecepatan" aria-labelledby="h-kecepatan" hidden></section>
    <section class="page" id="p-akurasi" aria-labelledby="h-akurasi" hidden></section>
    <section class="page" id="p-biaya" aria-labelledby="h-biaya" hidden></section>
    <section class="page" id="p-model" aria-labelledby="h-model" hidden></section>
    <section class="page" id="p-teknis" aria-labelledby="h-teknis" hidden></section>
    <section class="page" id="p-riwayat" aria-labelledby="h-riwayat" hidden></section>
    <p class="foot" id="foot"></p>
  </main>
</div>
<div id="tip" role="tooltip"></div>
<script>
"use strict";
const D = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ada = (v) => v !== null && v !== undefined && !(typeof v === "number" && Number.isNaN(v));
const nf = (v, d = 1) => ada(v) ? Number(v).toLocaleString("id-ID", { maximumFractionDigits: d, minimumFractionDigits: d }) : "—";
const n0 = (v) => ada(v) ? Math.round(v).toLocaleString("id-ID") : "—";
const pc = (v, d = 1) => ada(v) ? nf(v, d) + "%" : "—";
const BELUM = '<span class="belum">Belum tercatat</span>';
const T = D.tahap, P = D.pasca, S = D.sebelum;

/* ---------------- tarif & kurs (bisa diubah, dipakai semua halaman) ---------------- */
const SET = { tarif: D.tarif.usd_per_jam, kurs: D.kurs };
try { const s = JSON.parse(localStorage.getItem("evaluasi-tarif") || "null"); if (s && s.tarif > 0) SET.tarif = +s.tarif; if (s && s.kurs > 0) SET.kurs = +s.kurs; } catch (e) {}
const simpanSet = () => { try { localStorage.setItem("evaluasi-tarif", JSON.stringify(SET)); } catch (e) {} };
const usd = (v, d = 4) => ada(v) ? "USD " + Number(v).toLocaleString("id-ID", { maximumFractionDigits: d, minimumFractionDigits: d }) : "—";
const idr = (v) => ada(v) ? "Rp " + Math.round(v).toLocaleString("id-ID") : "—";
const biayaTahap = (t) => ada(t.durasi) ? (t.durasi / 3600) * SET.tarif : null;
const biayaTotal = (src) => Object.values(src.tahap).reduce((a, t) => a + (biayaTahap(t) || 0), 0);
const perSukses = (src) => biayaTotal(src) / src.total.lulus;

/* ---------------- perubahan sebelum -> sesudah ---------------- */
function ubah(lama, baru, kecilBaik = true, satuan = "", d = 1) {
  if (!ada(lama) || !ada(baru)) return '<span class="chip netral">tanpa pembanding</span>';
  const s = baru - lama, p = lama !== 0 ? (s / Math.abs(lama)) * 100 : null;
  const sama = Math.abs(s) < 1e-9, baik = kecilBaik ? s < 0 : s > 0;
  const tanda = s > 0 ? "+" : s < 0 ? "−" : "±";
  return `<span class="chip ${sama ? "netral" : baik ? "baik" : "buruk"}">${tanda}${nf(Math.abs(s), d)}${satuan}${ada(p) && !sama ? ` (${tanda}${nf(Math.abs(p), 0)}%)` : ""}</span>`;
}
const info = (teks) => `<span class="info" tabindex="0" data-tip="${esc(teks)}" aria-label="${esc(teks)}">?</span>`;

/* ---------------- tooltip ---------------- */
const tip = $("#tip");
function tunjuk(e, t) { tip.textContent = t; tip.style.display = "block"; const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tip.style.left = x + "px"; tip.style.top = y + "px"; }
document.addEventListener("mouseover", (e) => { const el = e.target.closest("[data-tip]"); if (el) tunjuk(e, el.dataset.tip); });
document.addEventListener("mousemove", (e) => { const el = e.target.closest("[data-tip]"); if (el) tunjuk(e, el.dataset.tip); else tip.style.display = "none"; });
document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); tunjuk({ clientX: r.right, clientY: r.bottom }, el.dataset.tip); } });
document.addEventListener("focusout", () => { tip.style.display = "none"; });

/* ---------------- grafik garis: sumbu x = jumlah pengguna (kategori) ---------------- */
function garis(o) {
  const W = 720, H = o.h || 270, L = 54, R = 18, Tp = 14, B = 40, iw = W - L - R, ih = H - Tp - B, xs = o.x, n = xs.length;
  const px = (i) => L + (n === 1 ? iw / 2 : (i * iw) / (n - 1));
  const vals = o.seri.flatMap((s) => s.v.filter(ada)); const maks = o.ymax ?? (Math.max(...vals, 0) * 1.1 || 1); const py = (v) => Tp + ih - (v / maks) * ih;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = (maks / 4) * i, y = py(v); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 8}" y="${y + 4}" text-anchor="end">${o.fmt(v)}</text>`; }
  xs.forEach((x, i) => { g += `<text class="ax" x="${px(i)}" y="${H - B + 18}" text-anchor="middle">${x}</text>`; });
  g += `<text class="axt" x="${L + iw / 2}" y="${H - 4}" text-anchor="middle">${esc(o.xlabel || "Jumlah pengguna aktif bersamaan")}</text>`;
  for (const s of o.seri) {
    let d = "", m = true; s.v.forEach((v, i) => { if (!ada(v)) { m = true; return; } d += `${m ? "M" : "L"}${px(i)},${py(v)}`; m = false; });
    g += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" ${s.putus ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
    s.v.forEach((v, i) => { if (!ada(v)) return; g += `<circle class="pt" tabindex="0" cx="${px(i)}" cy="${py(v)}" r="4.5" fill="${s.c}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`${s.nama} · ${xs[i]}${o.satuanX ?? " pengguna"}\n${o.label}: ${o.fmt(v)}`)}"/>`; });
  }
  return `<div class="leg">${o.seri.map((s) => `<span><i class="dot" style="background:${s.c}"></i>${esc(s.nama)}</span>`).join("")}</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)} per jumlah pengguna">${g}</svg></div>`;
}
/* ---------------- batang berpasangan (sebelum vs sesudah) ---------------- */
function pasang(o) {
  const W = 720, H = o.h || 250, L = 54, R = 12, Tp = 18, B = 40, iw = W - L - R, ih = H - Tp - B, n = o.x.length, slot = iw / n, bw = Math.min(24, slot / 3);
  const maks = Math.max(...o.seri.flatMap((s) => s.v.filter(ada)), 0) * 1.15 || 1, py = (v) => Tp + ih - (v / maks) * ih;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = (maks / 4) * i, y = py(v); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 8}" y="${y + 4}" text-anchor="end">${o.fmt(v)}</text>`; }
  o.x.forEach((x, i) => { const cx = L + slot * i + slot / 2;
    o.seri.forEach((s, j) => { const v = s.v[i]; if (!ada(v)) return; const h = Math.max(Tp + ih - py(v), 1.5), x0 = cx + (j === 0 ? -bw - 1 : 1);
      g += `<rect class="pt" tabindex="0" x="${x0}" y="${Tp + ih - h}" width="${bw}" height="${h}" rx="3" fill="${s.c}" data-tip="${esc(`${x}${o.satuanX ?? " pengguna"} · ${s.nama}\n${o.label}: ${o.fmt(v)}`)}"/>`; });
    g += `<text class="ax" x="${cx}" y="${H - B + 18}" text-anchor="middle">${x}</text>`; });
  g += `<text class="axt" x="${L + iw / 2}" y="${H - 4}" text-anchor="middle">${esc(o.xlabel || "Jumlah pengguna aktif bersamaan")}</text>`;
  return `<div class="leg">${o.seri.map((s) => `<span><i class="dot" style="background:${s.c}"></i>${esc(s.nama)}</span>`).join("")}</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}</svg></div>`;
}
/* ---------------- batang bertumpuk horizontal ---------------- */
function tumpuk(baris, bag) {
  const W = 720, tb = 22, jr = 10, L = 190, R = 58, H = baris.length * (tb + jr) + 6, iw = W - L - R;
  let g = "";
  baris.forEach((b, i) => { const y = 3 + i * (tb + jr), tot = bag.reduce((a, k) => a + (b[k.id] || 0), 0) || 1; let x = L;
    g += `<text class="axt" x="${L - 10}" y="${y + tb / 2 + 4}" text-anchor="end">${esc(b.label)}</text>`;
    for (const k of bag) { const v = b[k.id] || 0, w = (v / tot) * iw; if (v > 0) {
      g += `<rect class="pt" tabindex="0" x="${x}" y="${y}" width="${Math.max(w - 2, 1)}" height="${tb}" rx="4" fill="${k.c}" data-tip="${esc(`${b.label}\n${k.nama}: ${k.fmt ? k.fmt(v) : v}${k.fmt ? "" : ` dari ${tot}`}`)}"/>`;
      if (w > 30) g += `<text x="${x + w / 2 - 1}" y="${y + tb / 2 + 4}" text-anchor="middle" font-size="11.5" fill="var(--on-mark)" font-weight="600">${k.fmt ? k.fmt(v) : v}</text>`; } x += w; }
    if (b.kanan) g += `<text class="ax" x="${W - R + 8}" y="${y + tb / 2 + 4}">${esc(b.kanan)}</text>`; });
  return `<div class="leg">${bag.map((k) => `<span><i class="dot" style="background:${k.c}"></i>${esc(k.nama)}</span>`).join("")}</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Komposisi per baris">${g}</svg></div>`;
}

}
function csv(id) {
  const t = TABEL[id]; if (!t) return "";
  const bersih = (v) => { const s = v == null ? "" : String(v).replace(/<[^>]+>/g, ""); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return [t.kolom.map((k) => bersih(k.l.replace(/<[^>]+>/g, ""))).join(","), ...t.baris.map((r) => t.kolom.map((k) => bersih(r[k.id])).join(","))].join("\n");
}

function tafsirKec(m) {
  const p = P.tahap, s = S.tahap;
  if (m === "ttft") return `Di 1–12 pengguna, waktu mulai muncul hampir sama (±4–6 dtk). Di 20 pengguna sesudah optimasi lebih cepat: <b>${nf(s[20].ttft)} → ${nf(p[20].ttft)} dtk</b>. Kalau semua tahap digabung, mediannya sedikit lebih lambat (${nf(S.total.ttft)} → ${nf(P.total.ttft)} dtk); dugaan: penyaring jawaban baru menahan teks per kalimat sebelum dikirim (belum diukur terpisah).`;
  if (m === "tp") return `Makin banyak pengguna, makin banyak pertanyaan tuntas per menit. Di 12–20 pengguna sesudah optimasi jauh lebih tinggi (12 pengguna: ${nf(s[12].wf_menit)} → ${nf(p[12].wf_menit)}), terutama karena tidak ada lagi pertanyaan yang macet ratusan detik dan memperpanjang tahap.`;
  if (m === "p50") return `Satu pengguna menunggu ±${nf(p[1].p50, 0)} dtk. Dari 2 sampai 16 pengguna waktu tengah stabil ±30–38 dtk, lalu naik ke <b>${nf(p[20].p50)} dtk</b> di 20 pengguna karena antrean GPU mulai terbentuk. Sebelum optimasi: ${nf(s[20].p50)} dtk.`;
  return `Ekor (jawaban paling lambat) adalah perbaikan paling jelas: di 12–16 pengguna, ${m === "p99" ? "P99" : "P95"} turun dari ${nf(s[12][m])}–${nf(s[16][m])} dtk menjadi ${nf(p[12][m])}–${nf(p[16][m])} dtk, karena putaran agent pada tiket dan salah rute SOP sudah hilang.`;
}
function jelajah() {
  const p = P.tahap[tKec], s = S.tahap[tKec], ps = biayaTahap(p) / p.n, ss = biayaTahap(s) / s.n;
  const sel = (lbl, a, b, f, kecil, tipT) => `<div class="kpi"><div class="l">${lbl}${tipT ? " " + info(tipT) : ""}</div><div class="v" style="font-size:22px">${f(b)}</div><div class="k">sebelum ${f(a)}</div>${ubah(a, b, kecil, "")}</div>`;
  $("#jelajah").innerHTML = `<div class="grid3" style="gap:16px">
    ${sel("Jumlah pertanyaan", s.n, p.n, n0, false)}${sel("Median waktu selesai", s.p50, p.p50, (v) => nf(v) + " dtk", true)}${sel("Waktu mulai muncul", s.ttft, p.ttft, (v) => nf(v) + " dtk", true)}
    ${sel("Batas 95% jawaban", s.p95, p.p95, (v) => nf(v) + " dtk", true, "P95: 95% jawaban selesai dalam waktu ini atau kurang")}${sel("Respons terlama", s.max, p.max, (v) => nf(v) + " dtk", true)}${sel("Diproses per menit", s.wf_menit, p.wf_menit, (v) => nf(v), false)}
    ${sel("Akurasi (v2)", (100 * s.lulus) / s.n, (100 * p.lulus) / p.n, (v) => pc(v), false)}${sel("Biaya per pertanyaan", ss, ps, (v) => usd(v), true, "Biaya waktu server selama tahap ini dibagi jumlah pertanyaan, tarif " + usd(SET.tarif, 2) + "/jam")}
    ${sel("Gagal / sebagian (v2)", s.gagal + s.sebagian, p.gagal + p.sebagian, n0, true)}</div>
    <p class="ket" style="margin-top:10px">${tKec} pengguna aktif bersamaan × 3 pertanyaan = ${p.n} pertanyaan. Sesudah: ${p.lulus} lulus, ${p.sebagian} sebagian, ${p.gagal} gagal. Sebelum: ${s.lulus} lulus, ${s.sebagian} sebagian, ${s.gagal} gagal.</p>`;
}

/* ---------------- perbandingan EC2 vs API Anthropic ---------------- */
// ikutJam: pertanyaan per hari mengikuti pola uji × jam menyala, sampai pengguna mengetik angka sendiri
const API = { model: "sonnet-5-5", jenis: "campuran", q: null, cache: 0, tulis: 0, faktor: 1, ikutJam: true };
const kapasitasEc2 = () => Math.round(P.tahap[20].wf_menit * 60 * KALK.jam);   // pertanyaan per hari per server, beban 20 pengguna
const ec2Bulan = (q) => { const inst = Math.max(1, Math.ceil(q / Math.max(kapasitasEc2(), 1))); return { inst, usd: SET.tarif * KALK.jam * KALK.hari * inst }; };
const hargaApi = (id) => { const m = D.harga_api.model.find((x) => x.id === id);
  return { ...m, cacheKira: m.cache == null, cache: m.cache ?? m.masuk * 0.1, tulisKira: m.tulis == null, tulis: m.tulis ?? m.masuk * 1.25 }; };
function isiHargaApi() { const h = hargaApi(API.model); $("#a-hm").value = h.masuk; $("#a-hk").value = h.keluar; $("#a-hc").value = +h.cache.toFixed(4); $("#a-hw").value = +h.tulis.toFixed(4); }
function profilToken(j) {
  const x = j === "campuran" ? P.tahap[20] : P.kode[j];
  const kar = j === "campuran" ? Object.values(D.teks).reduce((a, t) => a + t.length, 0) / Object.keys(D.teks).length : x.kar_tanya;
  const tanya = Math.max(1, Math.round(kar / 4)), jawab = ada(x.kar_jawaban) ? Math.min(Math.round(x.kar_jawaban / 4), x.tok_keluar - x.tok_pikir) : null;
  return { masuk: x.tok_masuk, keluar: x.tok_keluar, pikir: x.tok_pikir, llm: x.llm, tanya, jawab, karTanya: Math.round(kar), karJawab: x.kar_jawaban };
}
// harga masuk rata-rata: porsi normal × harga masuk + porsi baca × harga baca cache + porsi tulis × harga tulis cache
const hargaMasukEfektif = (h, baca, tulis) => (1 - baca - tulis) * h.masuk + baca * h.cache + tulis * h.tulis;
const biayaPer = (t, h, baca, tulis, f) => { const bm = (t.masuk * f * hargaMasukEfektif(h, baca, tulis)) / 1e6, bk = (t.keluar * f * h.keluar) / 1e6; return { bm, bk, total: bm + bk }; };
function bandingApi() {
  if (!$("#a-hasil")) return;
  if (API.ikutJam) $("#a-q").value = kapasitasEc2();
  const q = angka("a-q", 1), cacheP = angka("a-cache"), tulisP = angka("a-tulis"), hm = angka("a-hm"), hk = angka("a-hk"), hc = angka("a-hc"), hw = angka("a-hw"), f = angka("a-faktor", 0.5);
  document.querySelectorAll("#a-preset button").forEach((b) => b.setAttribute("aria-pressed", String(+$("#a-q").value === (b.dataset.q === "uji" ? Math.round(kapasitasEc2()) : +b.dataset.q))));
  document.querySelectorAll("#a-preset-cache button").forEach((b) => b.setAttribute("aria-pressed", String(+$("#a-cache").value === +b.dataset.baca && +$("#a-tulis").value === +b.dataset.tulis)));
  const normalP = ada(cacheP) && ada(tulisP) ? 100 - cacheP - tulisP : null;
  $("#a-normal").textContent = ada(normalP) && normalP >= 0 ? nf(normalP, 0) : "—";
  if ([q, cacheP, tulisP, hm, hk, hc, hw, f].some((v) => v === null) || normalP < 0 || f > 2) {
    $("#a-hasil").innerHTML = '<p class="catatan"><b>Isian belum valid.</b> Pertanyaan per hari minimal 1, porsi baca + tulis cache paling banyak 100%, harga ≥ 0, pengali 0,5–2.</p>'; return; }
  API.q = q; API.cache = cacheP; API.tulis = tulisP; API.faktor = f;
  const h = { masuk: hm, keluar: hk, cache: hc, tulis: hw }, c = cacheP / 100, w = tulisP / 100, t = profilToken(API.jenis), b = biayaPer(t, h, c, w, f);
  const hb = hargaApi(API.model), def = hm === hb.masuk && hk === hb.keluar && Math.abs(hc - hb.cache) < 1e-9 && Math.abs(hw - hb.tulis) < 1e-9;
  const kira = [hb.cacheKira && "harga baca cache = 10% harga masuk", hb.tulisKira && "harga tulis cache = 1,25× harga masuk"].filter(Boolean);
  $("#a-harga-ket").innerHTML = def ? `Harga ${esc(hb.nama)} per ${esc(D.harga_api.tanggal)}${kira.length ? " · tidak tercantum, dipakai aturan umum: " + kira.join(", ") : ""}.` : "Harga diubah manual.";
  const apiHari = b.total * q, apiBulan = apiHari * KALK.hari, e = ec2Bulan(q), ec2Impas = SET.tarif * KALK.jam * KALK.hari / KALK.hari / b.total;
  const murah = apiBulan < e.usd, selisih = Math.abs(e.usd - apiBulan);
  const sel = (v, l) => `<div><b>${v}</b><span>${l}</span></div>`;
  $("#a-hasil").innerHTML = `<div class="hasil">
      ${sel(usd(b.total, 4), `API per pertanyaan · ${idr(b.total * SET.kurs)}`)}
      ${sel(usd(apiBulan, 0), `API per bulan · ${idr(apiBulan * SET.kurs)} · ${usd(apiHari, 2)}/hari`)}
      ${sel(usd(e.usd, 0), `EC2 per bulan · ${idr(e.usd * SET.kurs)} · ${e.inst} server × ${nf(KALK.jam, 0)} jam × ${n0(KALK.hari)} hari`)}
      ${sel(murah ? "API lebih murah" : "EC2 lebih murah", `selisih ${usd(selisih, 0)}/bulan · ${idr(selisih * SET.kurs)}`)}</div>
    <p class="tafsir">Dengan ${esc(hb.nama.replace(/ \(.*\)/, ""))}, API lebih murah daripada <b>1 server EC2 ${nf(KALK.jam, 0)} jam/hari</b> selama pertanyaan per hari di bawah <b>±${n0(ec2Impas)}</b>. Satu server EC2 sanggup ±${n0(kapasitasEc2())} pertanyaan per hari (uji 20 pengguna, ${nf(KALK.jam, 0)} jam).${e.inst > 1 ? ` Volume ${n0(q)} pertanyaan/hari butuh ±${e.inst} server — kapasitas di atas 1 server belum diuji.` : ""}</p>`;
  // rincian satu pertanyaan

  const hM = hargaMasukEfektif(h, c, w), uM =(n) => (n * f * hM) / 1e6, uK = (n) => (n * f * hk) / 1e6;

  const tot = baris.reduce((a, r) => a + r.u, 0);
  $("#a-rincian").innerHTML = tumpuk([{ label: "Token masuk", tanya: tf(t.tanya), lain: tf(lain), kanan: n0(tf(t.masuk)) }, { label: "Token keluar", pikir: tf(t.pikir), jawab: ada(t.jawab) ? tf(t.jawab) : 0, alat: ada(alat) ? tf(alat) : tf(t.keluar - t.pikir), kanan: n0(tf(t.keluar)) }],
      [{ id: "tanya", nama: "Pertanyaan pengguna", c: "var(--accent)", fmt: n0 }, { id: "lain", nama: "Instruksi, alat, hasil alat", c: "var(--base)", fmt: n0 }, { id: "pikir", nama: "Berpikir", c: "var(--c4)", fmt: n0 },
       { id: "jawab", nama: "Jawaban ke pengguna", c: "var(--accent)", fmt: n0 }, { id: "alat", nama: "Panggilan alat & antar-agent", c: "var(--c3)", fmt: n0 }])
    + tabel("api-rincian", [{ id: "k", l: "Arah" }, { id: "b", l: "Bagian" }, { id: "n", l: "Token", n: true, f: (v) => "±" + n0(v) }, { id: "u", l: "Biaya", n: true, f: (v) => usd(v, 5) }, { id: "p", l: "Porsi biaya", n: true, f: (v) => v < 1 ? "<1%" : pc(v, 0) }],
      baris.map((r) => ({ ...r, u: +r.u.toFixed(6), p: +((100 * r.u) / tot).toFixed(1) })), { cat: `Total ${usd(tot, 4)} per pertanyaan. Harga masuk rata-rata ${usd(hM, 3)}/1 jt token (${nf(normalP, 0)}% harga normal, ${nf(cacheP, 0)}% baca cache, ${nf(tulisP, 0)}% tulis cache).` });
  // semua pilihan pada volume ini
  const rows = D.harga_api.model.map((m) => { const hh = hargaApi(m.id), bb = biayaPer(t, m.id === API.model ? h : hh, c, w, f); return { label: m.nama.replace(/ \(.*\)/, ""), v: bb.total * q * KALK.hari, c: m.id === API.model ? "var(--accent)" : "var(--base)" }; });
  rows.push({ label: `EC2 g5.12xlarge (${e.inst} server)`, v: e.usd, c: "var(--c3)" });

    <li><b>Pemanggilan ganda (idempotensi):</b> alat identik berulang ${R.q5.alat_berulang}×, rancangan ganda ${R.q5.rancangan_ganda}×, klaim tersimpan palsu ${R.q5.klaim_tersimpan_palsu}×.</li>
    <li><b>Periode data (Q1):</b> periode September dikirim ke alat ${R.q1.periode_sesuai}/${R.n_q1}; penolakan periode ${R.q1.perlu_periode_ditolak}×.</li>
    <li><b>Pembatalan:</b> terbukti sampai ke server model pada uji 24 Nov pagi (pembuatan jawaban berhenti di token ke-206). Pembatalan saat browser ditutup belum diuji; jalur web belum meneruskan sinyalnya.</li></ul></div></details>
  <details><summary>Akar masalah kegagalan yang tersisa</summary><div class="isi">
    <p><b>Q4 salah rute (1×, 16 pengguna).</b> Router memilih agent yang tercantum di daftar tetapi tidak punya alat. Penjaga menolaknya dengan benar, tetapi tidak menyarankan agent pemegang SOP; router lalu menjawab sendiri bahwa SOP tidak tersedia. Jenis: kesalahan routing. Usulan perbaikan: saat agent tujuan tidak tersedia dan kebutuhannya dokumen, alihkan ke pemegang SOP.</p>
    <p><b>Q5 menawarkan tiket (11×).</b> Agent mengikuti aturan "cari panduan dulu", tidak menemukan panduan, lalu menawarkan tiket alih-alih langsung membuat rancangan. Jenis: kesalahan workflow (instruksi + model).</p>
    <p><b>Q5 dinilai gagal (1×).</b> Agent meminta pengguna memilih kategori dari daftar sah — benar — tetapi pola evaluator tidak mengenalinya. Jenis: kesalahan evaluator.</p></div></details>
  <details><summary>Kamus metrik</summary><div class="isi">${tabel("kamus", [{ id: 0, l: "Nama sederhana" }, { id: 1, l: "Nama teknis" }, { id: 2, l: "Satuan" }, { id: 3, l: "Definisi" }, { id: 4, l: "Cara membaca" }, { id: 5, l: "Berpengaruh ke" }], GLOSARIUM.map((g) => ({ ...g })), { csv: false })}</div></details>
  <details><summary>Metodologi, sumber data, dan inkonsistensi</summary><div class="isi"><ul>
    <li><b>Server:</b> ${esc(D.konfig.server)}. <b>Model:</b> ${esc(D.konfig.model)}. ${esc(D.konfig.image)}.</li>
    <li><b>Gateway &amp; agent:</b> ${esc(D.konfig.gateway)}. ${esc(D.konfig.agent)}.</li>
    <li><b>Beban:</b> ${esc(D.konfig.workload)}. Pemanasan sesudah optimasi: ${D.pemanasan.n} pertanyaan, median ${nf(D.pemanasan.p50)} dtk — tidak dihitung di angka mana pun.</li>
    <li><b>Persentil</b> dihitung ulang dari waktu tiap pertanyaan dengan interpolasi linear untuk semua uji. Laporan lama memakai cara lain (peringkat terdekat), jadi P95/P99 di tahap kecil bisa berbeda dari laporan lama (contoh: P95 12 pengguna sebelum optimasi 99,7 dtk di sini vs 122,4 dtk di laporan 1 vs 4 GPU).</li>
    <li><b>Data "sebelum optimasi" digabung dari dua hari:</b> 1–8 pengguna dari uji 20 Nov, 10–20 pengguna dari uji 23 Nov. Server, model, setelan, dan skrip sama; versi agent sama (sebelum Tahap 1–6).</li>
    <li><b>Akurasi sebelum optimasi</b> = penilaian ulang evaluator v2 atas bukti yang tercatat saat itu (${esc(D.sumber.v2)}).</li>
    <li><b>Sumber:</b> sesudah ${esc(D.sumber.pasca)} · sebelum ${esc(D.sumber.sebelum.join(" + "))} · 27B ${esc(D.sumber.q27)} · model langsung ${esc(D.sumber.langsung)}.</li>
    <li><b>Waktu mulai muncul</b> dicatat di sisi pengguna (laptop uji, lewat tunnel Cloudflare), jadi termasuk jaringan.</li></ul></div></details>`;
}

  if (!HAL.some(([x]) => x === k)) k = "ringkasan";

  document.querySelectorAll("#menu a").forEach((a) => { if (a.dataset.ke === k) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (gulir) { scrollTo({ top: 0 }); $("#isi").focus({ preventScroll: true }); }
}

document.addEventListener("click", (e) => { const a = e.target.closest("[data-ke]"); if (!a) return; e.preventDefault(); try { history.replaceState(null, "", "#" + a.dataset.ke); } catch (er) {} buka(a.dataset.ke);
  if (a.dataset.gulir) { const t = document.getElementById(a.dataset.gulir); if (t && t.scrollIntoView) t.scrollIntoView({ block: "start" }); } });
addEventListener("hashchange", () => buka(location.hash.slice(1).split("&")[0]));
const tema = $("#tema");
const pakaiTema = (t) => { document.documentElement.dataset.theme = t; tema.textContent = t === "dark" ? "Mode terang" : "Mode gelap"; tema.setAttribute("aria-pressed", String(t === "dark")); try { localStorage.setItem("evaluasi-tema", t); } catch (e) {} };
const sistemGelap = () => { try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; } };
tema.onclick = () => pakaiTema((document.documentElement.dataset.theme || (sistemGelap() ? "dark" : "light")) === "dark" ? "light" : "dark");
{ const t0 = document.documentElement.dataset.theme || (sistemGelap() ? "dark" : "light"); tema.textContent = t0 === "dark" ? "Mode terang" : "Mode gelap"; tema.setAttribute("aria-pressed", String(t0 === "dark")); }
const h0 = new URLSearchParams(location.hash.slice(1).split("&").slice(1).join("&")); if (h0.get("tema")) pakaiTema(h0.get("tema"));
$("#cetak").onclick = () => { HAL.forEach(([x, , f]) => { $("#p-" + x).hidden = false; f(); }); setTimeout(() => { print(); buka(location.hash.slice(1).split("&")[0] || "ringkasan", false); }, 60); };
let tertutup = [];

  tertutup = [...document.querySelectorAll("details:not([open])")]; tertutup.forEach((d) => { d.open = true; }); });
addEventListener("afterprint", () => { tertutup.forEach((d) => { d.open = false; }); tertutup = []; });
