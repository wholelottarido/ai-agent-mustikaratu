<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ratu AI — Hasil Pengujian</title>
<script>try{var t=localStorage.getItem('tema-dashboard');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface2:#f1f3f6;--ink:#0f172a;--ink2:#475569;--ink3:#64748b;--line:#e2e8f0;--grid:#e8ecf1;
  --accent:#4f46e5;--accent-ink:#3730a3;--accent-soft:#eef0ff;
  --good:#15803d;--good-soft:#e7f6ec;--bad:#b42318;--bad-soft:#fdecea;--warn:#a15c07;--warn-soft:#fdf3e1;
  --b2p:#d97706;--b2s:#9a3412;--b3:#0f9d76;--b4:#4f46e5;
  --w-persiapan:#8b5cf6;--w-tunggu:#94a3b8;--w-berpikir:#ea580c;--w-rencana:#0d9488;--w-menulis:#2563eb;--w-ekor:#cbd5e1;--w-alat:#ca8a04;--w-lain:#475569;
  --pita:#eef1f5;--shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0f17;--surface:#121826;--surface2:#182033;--ink:#e6e9ef;--ink2:#a8b1c2;--ink3:#8691a5;--line:#232c3d;--grid:#1f2737;
  --accent:#8b8ff9;--accent-ink:#c7c9ff;--accent-soft:#1d2140;
  --good:#4ade80;--good-soft:#11291b;--bad:#f87171;--bad-soft:#2e1416;--warn:#fbbf24;--warn-soft:#2b210d;
  --b2p:#f59e0b;--b2s:#fb8a5a;--b3:#34d399;--b4:#8b8ff9;
  --w-persiapan:#a78bfa;--w-tunggu:#64748b;--w-berpikir:#f97316;--w-rencana:#2dd4bf;--w-menulis:#60a5fa;--w-ekor:#334155;--w-alat:#facc15;--w-lain:#94a3b8;
  --pita:#18202f;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.brand b{display:block;font-size:14px}.brand small{color:var(--ink3);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .grup{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:0 10px;margin-bottom:4px}
.side .bawah{margin-top:auto;display:flex;flex-direction:column;gap:2px}
/* main */
main{min-width:0;padding:28px 32px 56px;max-width:1240px;width:100%;overflow-wrap:anywhere}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.top h1{font-size:26px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
.top .sub{color:var(--ink2);margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.badge.hist::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.badge.agent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.badge.direct{background:var(--good-soft);color:var(--good);border-color:transparent}
.aksi{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink2);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{color:var(--ink);border-color:var(--ink3)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.mtabs{display:none}
.view[hidden]{display:none}
.subnav{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 18px;padding-left:10px;border-left:2px solid var(--line)}
.nav .subnav button{display:block;padding:5px 8px;font-size:12.5px;font-weight:400;color:var(--ink2);border-radius:6px;line-height:1.35;white-space:normal}
.nav .subnav button.l3{padding-left:16px;font-size:12px;color:var(--ink3)}
.nav .subnav button.aktif{color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
.lompat{display:none}
.emb iframe{display:block;width:100%;height:80vh;border:0;background:var(--bg)}
.nav .grup{margin:14px 0 4px}
.gbox{margin:2px 0}.gbox+.gbox{margin-top:6px}.gsolo{margin-bottom:8px}
.ghead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink2)}
.ghead:hover{background:var(--surface2)}.ghead b{font-size:12.5px;font-weight:650;display:block;color:var(--ink)}
.ghead .tgl{display:block;font-size:10.5px;color:var(--ink3);font-weight:400}
.chev{width:14px;height:14px;flex:0 0 14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.gbox.buka>.ghead .chev{transform:rotate(90deg)}
.gisi{display:none;padding-left:6px;border-left:2px solid var(--line);margin-left:16px}
.gbox.buka>.gisi,.gsolo>.gisi{display:block}
.subjudul{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:10px 10px 3px}
@media print{.gisi{display:block}}
.nav .grup:first-child{margin-top:0}
.nav .tgl{display:block;font-size:10.5px;text-transform:none;letter-spacing:0;color:var(--ink3);font-weight:400}
.mtabs .sep{flex:none;align-self:center;font-size:11px;color:var(--ink3);padding:0 2px 0 8px;white-space:nowrap}
.rilis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:14px 0}
.rilis .card{margin:0;display:flex;flex-direction:column;gap:8px}
.rilis .card.baru{border-left:4px solid var(--accent)}
.rilis .tgl{font-size:12px;color:var(--ink3);margin:0}
.rilis ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13.5px}
.rilis .angka{display:flex;gap:16px;flex-wrap:wrap;margin:2px 0}
.rilis .angka div{display:flex;flex-direction:column}
.rilis .angka b{font-size:20px;font-variant-numeric:tabular-nums}
.rilis .angka span{font-size:12px;color:var(--ink2)}
.rilis .ke{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
@media (max-width:1100px){.rilis{grid-template-columns:minmax(0,1fr)}}
h2{font-size:18px;margin:30px 0 4px;letter-spacing:-.005em}
h3{font-size:15px;margin:0 0 4px}
.lead{color:var(--ink2);margin:0 0 14px;max-width:880px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);margin:14px 0}
.card .ket{color:var(--ink2);font-size:13px;margin:0 0 10px}
.src{color:var(--ink3);font-size:12px;margin:10px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2>.card,.grid3>.card{margin:0;min-width:0}
.card{min-width:0}
.hero{background:linear-gradient(0deg,var(--surface),var(--surface));border-left:4px solid var(--accent)}
.hero p{margin:0 0 8px;font-size:15px;max-width:920px}
.hero .batas{color:var(--ink3);font-size:13px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:500}
.kpi .v{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:3px}
.kpi .k{font-size:12px;color:var(--ink3)}
.delta{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;max-width:100%;margin-top:6px;align-self:flex-start;line-height:1.4}
.delta.good{background:var(--good-soft);color:var(--good)}.delta.bad{background:var(--bad-soft);color:var(--bad)}.delta.netral{background:var(--surface2);color:var(--ink2)}
.list{margin:0;padding-left:18px}.list li{margin:5px 0}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:4px 0 12px}
.ctl .lbl{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface2);gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink2);font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;padding:3px 8px 3px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.chk input{accent-color:var(--accent)}
.chk i,.leg i{display:inline-block;width:10px;height:10px;border-radius:3px}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2);margin:2px 0 6px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.chart{width:100%;min-height:40px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--grid)}.chart .ax{fill:var(--ink3);font-size:11px}.chart .axt{fill:var(--ink2);font-size:11.5px}
.chart .el{fill:var(--ink);font-size:11px;font-weight:600}
.chart .ref{stroke:var(--ink3);stroke-dasharray:4 4}
.chart .pt{cursor:pointer}
.chart .band{fill:var(--pita)}
.interpret{background:var(--accent-soft);color:var(--ink);border-radius:9px;padding:10px 13px;font-size:13.5px;margin:12px 0 0}
.interpret b{color:var(--accent-ink)}
.caveat{background:var(--warn-soft);border-radius:9px;padding:10px 13px;font-size:13.5px;margin:10px 0}
.caveat b{color:var(--warn)}
.na{color:var(--ink3);font-style:italic}
details.raw{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.raw>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.raw>summary::-webkit-details-marker{display:none}
details.raw>summary::before{content:"▸";transition:transform .15s}
details.raw[open]>summary::before{transform:rotate(90deg)}
.tblbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 6px}
.tblbar input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;min-width:0;width:220px;max-width:100%}
.tblbar .n{color:var(--ink3);font-size:12px;margin-left:auto}
.tw{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
td.num,th.num{text-align:right}
thead th{position:sticky;top:0;background:var(--surface2);color:var(--ink2);font-weight:600;z-index:1}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button::after{content:"↕";color:var(--ink3);font-size:11px}
th[aria-sort="ascending"] button::after{content:"↑";color:var(--accent)}
th[aria-sort="descending"] button::after{content:"↓";color:var(--accent)}
tbody tr:hover{background:var(--surface2)}
td.wrap{white-space:normal;min-width:220px}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-weight:600}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;max-width:320px;white-space:pre-line;display:none;box-shadow:0 6px 20px rgba(0,0,0,.18)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.scrim[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(720px,100vw);background:var(--surface);z-index:41;overflow:auto;padding:22px 24px 40px;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer[hidden]{display:none}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.drawer h2{margin:0}
dl.gloss{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:12px 0}
dl.gloss dt{font-weight:700}dl.gloss dd{margin:0;color:var(--ink2)}
.foot{color:var(--ink3);font-size:12px;margin-top:36px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:1100px){.grid3,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
.lompat{display:block;position:fixed;right:12px;bottom:12px;z-index:30;max-width:calc(100vw - 24px);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;box-shadow:var(--shadow)}
.lompat:empty{display:none}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:16px 16px 48px}
  .mtabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin:0 0 10px;border-bottom:1px solid var(--line)}
  .mtabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
  .mtabs button[aria-current="page"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top h1{font-size:22px}
  .kpi .v{font-size:23px}
  dl.gloss{grid-template-columns:1fr}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
@media print{
  .side,.mtabs,.aksi,.ctl,.tblbar,#tip,.scrim,.drawer,.lompat{display:none!important}
  .app{display:block} main{max-width:none;padding:0}
  .view[hidden]{display:block!important}
  .view{break-before:page}
  .view:first-of-type{break-before:auto}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  details.raw{display:none}
  .tw{max-height:none;overflow:visible}
  body{background:#fff}
}
</style>
</head>
<body>
<a class="skip" href="#isi">Lewati ke konten</a>
<div class="app">
  <aside class="side" aria-label="Navigasi dashboard">
    <div class="brand"><div class="logo" aria-hidden="true">R</div><div><b>Ratu AI</b><small>Performance Analytics</small></div></div>
    <nav class="nav" id="nav" aria-label="Halaman laporan"></nav>
    <div class="bawah">
      <div class="grup">Referensi</div>
      <div class="nav">
        <button type="button" data-drawer="metodologi"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Metodologi &amp; sumber</button>
        <button type="button" data-drawer="glosarium"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Glosarium</button>
      </div>
    </div>
  </aside>
  <main id="isi" tabindex="-1">
    <div class="mtabs" id="mtabs" role="navigation" aria-label="Navigasi dashboard"></div>
    <header class="top">
      <div>
        <h1>Ratu AI — Hasil Pengujian</h1>
        <p class="sub">Model Qwen3-14B-AWQ dan Qwen3.8-27B · vLLM · LiteLLM · GPU NVIDIA A10G 24 GB · mesin A: g5.2xlarge (1 GPU) · mesin B: g5.12xlarge (4 GPU)</p>
        <div class="badges">
          <span class="badge hist">Hasil uji 13–23 November 2026</span>
          <span class="badge">Rekaman hasil uji, bukan pemantauan langsung</span>
        </div>
      </div>
      <div class="aksi">
        <button class="btn" type="button" data-drawer="metodologi" aria-label="Buka metodologi">Metodologi</button>
        <button class="btn" type="button" data-drawer="glosarium" aria-label="Buka glosarium">Glosarium</button>
        <button class="btn" type="button" id="cetak"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>Cetak / PDF</button>
        <button class="btn" type="button" id="tema" aria-pressed="false">Tema gelap</button>
      </div>
    </header>

    <section class="view" id="v-beranda" aria-labelledby="h-beranda"></section>
    <section class="view emb" id="v-emb-po" aria-label="Pasca-optimasi" hidden><iframe id="f-po" title="Benchmark sesudah perbaikan workflow agent, 1 sampai 20 pengguna"></iframe></section>
    <section class="view emb" id="v-emb-gpu4" aria-label="1 GPU vs 4 GPU" hidden><iframe id="f-gpu4" title="Perbandingan 1 GPU vs 4 GPU"></iframe></section>
    <section class="view emb" id="v-emb-q27" aria-label="Qwen3.8-27B" hidden><iframe id="f-q27" title="Hasil Qwen3.8-27B"></iframe></section>
    <section class="view emb" id="v-emb-s14" aria-label="Kapasitas Qwen3-14B" hidden><iframe id="f-s14" title="Kapasitas Qwen3-14B, 1 sampai 20 pengguna"></iframe></section>
    <section class="view emb" id="v-emb-w17" aria-label="Alur agent 17 November" hidden><iframe id="f-w17" title="Profil alur agent 17 November"></iframe></section>
    <section class="view" id="v-overview" aria-labelledby="h-overview" hidden></section>
    <section class="view" id="v-load" aria-labelledby="h-load" hidden></section>
    <section class="view" id="v-model" aria-labelledby="h-model" hidden></section>
    <section class="view" id="v-agent" aria-labelledby="h-agent" hidden></section>
    <section class="view" id="v-gpu" aria-labelledby="h-gpu" hidden></section>

    <p class="foot" id="foot"></p>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-judul" hidden></aside>
<div id="tip" role="tooltip"></div>
<select class="lompat" id="lompat" aria-label="Lompat ke bagian"></select>

<script>
"use strict";
const DATA = /*__DATA__*/null;
const P = [1, 2, 3, 5, 8];
const U = Object.fromEntries(DATA.uji.map(u => [u.key, u]));
const WARNA = { b2p: "--b2p", b2s: "--b2s", b3: "--b3", b4: "--b4" };
const BENTUK = { b2p: "kotak", b2s: "lingkaran", b3: "lingkaran", b4: "lingkaran" };

/* ---------- format ---------- */
const nf = (x, d = 1) => x == null || Number.isNaN(x) ? "—" : Number(x).toLocaleString("id-ID", { minimumFractionDigits: d, maximumFractionDigits: d });
const nf0 = x => nf(x, 0);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const jamWIB = iso => { const d = new Date(new Date(iso).getTime() + 7 * 3600e3); return `${String(d.getUTCHours()).padStart(2, "0")}.${String(d.getUTCMinutes()).padStart(2, "0")}`; };
const tgl = s => ({ "2026-11-13": "13 Nov 2026", "2026-11-16": "16 Nov 2026" }[s] || s);
const T = (u, n) => u.tahap[String(n)];

}

const NAMA_BAG = { persiapan: "Persiapan agent", tunggu: "Menunggu kata pertama", berpikir: "Model berpikir", rencana: "Model menulis perintah alat", menulis: "Model menulis teks", ekor: "Model, sisa lain", alat: "Alat berjalan", lain: "Kode agent & jeda" };

function waterfall(w, q) {

    else baris.push({ label: l.label + (l.masuk ? ` · ${nf0(l.masuk)}→${nf0(l.keluar)} tok` : ""), seg: l.seg.map(([k, x, y]) => [k, l.a + x, l.a + y]) });

  let s = "";
  for (let v = 0; v <= top + 1e-9; v += lg) s += `<line class="gl" x1="${xp(v)}" x2="${xp(v)}" y1="${Tp}" y2="${H - 38}"/><text class="ax" x="${xp(v)}" y="${H - 24}" text-anchor="middle">${nf(v, Number.isInteger(lg) ? 0 : 1)}</text>`;
  s += `<line x1="${xp(q.total)}" x2="${xp(q.total)}" y1="${Tp}" y2="${H - 38}" stroke="var(--ink2)" stroke-dasharray="3 3"/>`;
  baris.forEach((b, i) => {

    s += `<text class="ax" x="${L - 8}" y="${y + 12}" text-anchor="end">${esc(b.label.length > 52 ? b.label.slice(0, 51) + "…" : b.label)}</text>`;
    b.seg.forEach(([k, a, z]) => { const t = `${b.label}\n${NAMA_BAG[k]}: ${nf(z - a, 2)} dtk\nmulai detik ${nf(a)}`;
      s += `<rect x="${xp(a)}" y="${y}" width="${Math.max(1.5, xp(z) - xp(a))}" height="${tinggi - 8}" rx="2" fill="var(--w-${k})" class="pt" data-tip="${esc(t)}"/>`; });
  });
  s += `<text class="axt" x="${(L + w - R) / 2}" y="${H - 6}" text-anchor="middle">detik sejak pertanyaan dikirim · garis putus = jawaban selesai (${nf(q.total)} dtk)</text>`;

    <dl class="gloss">
      <dt>P50 (waktu tengah)</dt><dd>Separuh pengukuran lebih cepat dari angka ini, separuh lagi lebih lambat.</dd>
      <dt>P95</dt><dd>95 dari 100 pengukuran lebih cepat dari angka ini. Angka ini menggambarkan yang lambat. Sampel kita kecil (15–24), jadi satu nilai lambat saja bisa menggesernya.</dd>
      <dt>n</dt><dd>Jumlah pengukuran di balik sebuah angka, misalnya jumlah pertanyaan.</dd>
      <dt>Token</dt><dd>Potongan kata yang dibaca dan ditulis model. Satu kata bisa satu token atau lebih.</dd>
      <dt>TTFT</dt><dd>Time to first token — waktu sampai kata pertama muncul. Dihitung dari permintaan dikirim sampai token pertama keluar. Termasuk waktu antre dan waktu mengolah prompt (prefill).</dd>
      <dt>TPOT</dt><dd>Time per output token — jeda rata-rata antar token setelah kata pertama. Makin kecil, makin cepat model menulis.</dd>
      <dt>TPS / throughput</dt><dd>Token per detik. <i>Per permintaan</i> = kecepatan menulis satu jawaban. <i>Gabungan</i> (throughput) = berapa banyak token yang selesai per detik dari semua permintaan sekaligus.</dd>
      <dt>Antrean (queue)</dt><dd>Permintaan yang menunggu giliran di vLLM sebelum dikerjakan. Waktu tunggunya disebut queue time.</dd>
      <dt>max-num-seqs</dt><dd>Batas permintaan yang dikerjakan vLLM sekaligus. Permintaan selebihnya menunggu giliran. Batas ini tidak menjamin empat prompt 16K token penuh selalu muat — itu bergantung pada total token yang sedang dikerjakan.</dd>

      <dt>VRAM</dt><dd>Memori di kartu GPU. vLLM memesan 85% di awal (gpu-memory-utilization 0,85), jadi angkanya tetap selama uji.</dd>
      <dt>KV cache</dt><dd>Memori GPU untuk percakapan yang sedang dikerjakan. Persentase terpakainya berbeda dari VRAM yang dipesan vLLM.</dd>
      <dt>Prefix cache (cold / warm)</dt><dd>vLLM menyimpan hasil olahan awal prompt. Prompt yang awalnya sama tidak perlu diolah ulang (warm). Prompt yang belum pernah diolah disebut cold.</dd>
      <dt>Preemption</dt><dd>vLLM menghentikan sementara sebuah permintaan karena memori kerjanya penuh. Tercatat 0 di benchmark dan profil.</dd>
      <dt>vLLM</dt><dd>Program yang menjalankan model di GPU.</dd>
